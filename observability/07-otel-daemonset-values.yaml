mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.110.0"

presets:
  # This preset automatically mounts /var/log/pods and /var/lib/docker/containers
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
  kubeletMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    # The preset defines a receiver called 'filelog', 
    # but we can leave this block empty or omit it if using default preset settings.

  processors:
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.container.name
          - k8s.deployment.name
          - k8s.replicaset.name
    
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    batch:
      send_batch_size: 1024
      timeout: 5s

    resource:
      attributes:
        - key: k8s.cluster.name
          value: "self-managed-aws"
          action: upsert

  exporters:
    # Sending logs to Loki via OTLP
    otlphttp/loki:
      endpoint: "http://loki-gateway.observability.svc:80/otlp"
      tls:
        insecure: true

    prometheusremotewrite/vm:
      endpoint: "http://victoriametrics-victoria-metrics-single-server.observability.svc:8428/api/v1/write"
      resource_to_telemetry_conversion:
        enabled: true

    otlp/tempo:
      endpoint: "tempo.observability.svc:4317"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        # 'filelog' is the name of the receiver injected by the preset
        receivers: [filelog]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [prometheusremotewrite/vm]
      traces:
        receivers: [otlp]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [otlp/tempo]

# REMOVED: extraVolumes and extraVolumeMounts for /var/log/pods 
# because they conflict with the logsCollection preset.

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# ClusterRole rules look good for 2026 k8sattributes requirements
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes", "nodes/proxy", "services", "endpoints"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.110.0"

service:
  enabled: true
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

# Correct key for environment variables
extraEnvs:
  - name: K8S_NODE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: false 
  kubeletMetrics:
    enabled: false

config:
  receivers:
    kubeletstats:
      # Use the environment variable for the local node
      endpoint: "https://${env:K8S_NODE_IP}:10250"
      auth_type: "serviceAccount"
      insecure_skip_verify: true
    
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  processors:
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.container.name
          - k8s.deployment.name
          - k8s.replicaset.name
    
    memory_limiter:
      check_interval: 5s
      limit_percentage: 90
      spike_limit_percentage: 10

    batch:
      send_batch_size: 1024
      timeout: 5s

    resource:
      attributes:
        - key: k8s.cluster.name
          value: "self-managed-aws"
          action: upsert

  exporters:
    otlphttp/loki:
      # Bypassing gateway directly to the loki pod service
      endpoint: "http://loki.observability.svc:3100/otlp"
      tls:
        insecure: true

    prometheusremotewrite/vm:
      endpoint: "http://victoriametrics-victoria-metrics-single-server.observability.svc:8428/api/v1/write"
      resource_to_telemetry_conversion:
        enabled: true

    otlp/tempo:
      endpoint: "tempo.observability.svc:4317"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp, kubeletstats]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [prometheusremotewrite/vm]
      traces:
        receivers: [otlp]
        processors: [k8sattributes, resource, memory_limiter, batch]
        exporters: [otlp/tempo]

resources:
  requests:
    cpu: "30m"      # Minimal request to stay under your 95% CPU cap
    memory: "150Mi" # Enough to boot without "Refusing data" immediately
  limits:
    cpu: "200m"
    memory: "300Mi"

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes", "nodes/proxy", "services", "endpoints", "nodes/stats"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  # FIX: memberlist belongs under the 'loki' key
  memberlist:
    join_members:
      - 127.0.0.1

  # FIX: storage and schema belong under the 'loki' key
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 48h
    max_query_length: 72h
    max_query_parallelism: 16
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  otlp:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - service.name
            - service.namespace

# Sidecar is a TOP-LEVEL key
sidecar:
  enabled: false
  rules:
    enabled: false

# These are TOP-LEVEL keys
memcachedExporter: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }

# SingleBinary configuration
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 3Gi
    storageClass: "obs-ebs-gp3"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# Scaling modes (Disabled for SingleBinary)
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }

# Gateway configuration
gateway:
  enabled: true
  replicas: 1
  # FIX: Correct for single-node scheduling
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"